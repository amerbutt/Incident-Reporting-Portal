<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Outer Shield Ring -->
  <path d="M256 72 L384 128 C384 272 256 384 256 384 C256 384 128 272 128 128 Z" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="14" stroke-linejoin="round"/>
  <!-- Inner Shield -->
  <path d="M256 96 L360 142 C360 256 256 352 256 352 C256 352 152 256 152 142 Z" fill="url(#shieldGrad)"/>
  <!-- Core Insignia Checkmark / D-12 Star -->
  <path d="M224 232 L248 256 L304 192" fill="none" stroke="#1e3a8a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- D12 Monogram -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">D-12 IIP</text>
</svg>
